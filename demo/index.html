<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>APlayer · 玻璃拟态悬浮播放器</title>
        <style>
            /* 模拟个人网站的主题令牌（与 src/css/core/variables.css 保持一致） */
            :root {
                --bg-color: #f4f3f0;
                --surface-color: #ffffff;
                --text-color: #23231f;
                --text-secondary: #6d6d66;
                --accent-color: #ab4f57;
                --accent-light: #cd8189;
                --accent-rgb: 171, 79, 87;
                --border-color: #e4e1da;
                --border-light: #edebe5;
                --shadow-color: rgba(35, 35, 31, 0.06);
                --shadow-md: 0 6px 18px var(--shadow-color);
                --shadow-offset: 6px 6px 0 -2px rgba(var(--accent-rgb), 0.07);
                --radius-lg: 14px;
                --radius-xl: 18px;
                --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                    'Microsoft YaHei', sans-serif;
            }

            [data-theme='dark'] {
                --bg-color: #101015;
                --surface-color: #17171e;
                --text-color: #e9ebf0;
                --text-secondary: #a2a6b4;
                --accent-color: #5aa9ff;
                --accent-light: #a3d4ff;
                --accent-rgb: 90, 169, 255;
                --border-color: #2c2c37;
                --border-light: #24242e;
                --shadow-color: rgba(0, 0, 0, 0.5);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                padding: 60px 24px 160px;
                font-family: var(--font-sans);
                color: var(--text-color);
                background: var(--bg-color);
                transition: background 0.3s, color 0.3s;
            }

            main {
                max-width: 720px;
                margin: 0 auto;
            }

            h1 {
                font-size: 1.8rem;
                margin: 0 0 8px;
            }

            p {
                line-height: 1.7;
                color: var(--text-secondary);
            }

            .panel {
                margin-top: 24px;
                padding: 18px 20px;
                border: 1px solid var(--border-color);
                border-radius: var(--radius-xl);
                background: var(--surface-color);
                box-shadow: var(--shadow-md);
            }

            button {
                padding: 8px 14px;
                border: 1px solid var(--border-color);
                border-radius: 999px;
                background: transparent;
                color: var(--text-color);
                font-family: inherit;
                font-size: 13px;
                cursor: pointer;
                transition: color 0.2s, background-color 0.2s, border-color 0.2s;
            }

            button:hover {
                border-color: var(--accent-color);
                color: var(--accent-color);
            }

            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }

            kbd {
                padding: 2px 6px;
                border: 1px solid var(--border-color);
                border-radius: 6px;
                background: var(--bg-color);
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>APlayer · 玻璃拟态悬浮播放器</h1>
            <p>
                左下角为播放器本体：可拖拽、可缩放、空闲自动折叠，右上角为可拖拽的桌面歌词（右键唤出设置）。
            </p>

            <div class="panel">
                <div class="row">
                    <button data-action="toggle">播放 / 暂停</button>
                    <button data-action="prev">上一首</button>
                    <button data-action="next">下一首</button>
                    <button data-action="zoom-out">缩小</button>
                    <button data-action="zoom-in">放大</button>
                    <button data-action="zoom-reset">重置缩放</button>
                    <button data-action="theme">切换主题</button>
                    <button data-action="destroy">销毁实例</button>
                </div>
                <p>
                    拖拽：在播放器空白处按住拖动；缩放：<kbd>Ctrl</kbd> / <kbd>⌘</kbd> +
                    滚轮（触控板双指）；位置与缩放都会写入 localStorage。
                </p>
            </div>
        </main>

        <script src="../dist/APlayer.min.js"></script>
        <script>
            const ap = new APlayer({ container: document.body });

            ap.on('play', (song) => console.log('[demo] play:', song && song.name));
            ap.on('pause', () => console.log('[demo] pause'));
            ap.on('switch', (song) => console.log('[demo] switch:', song && song.name));

            const actions = {
                toggle: () => ap.toggle(),
                prev: () => ap.prev(),
                next: () => ap.next(),
                'zoom-in': () => ap.scale(Math.min(1.6, Number(localStorage.getItem('player-widget-scale') || 1) + 0.05)),
                'zoom-out': () => ap.scale(Math.max(0.75, Number(localStorage.getItem('player-widget-scale') || 1) - 0.05)),
                'zoom-reset': () => ap.scale(),
                theme: () => {
                    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                    document.documentElement.dataset.theme = next;
                },
                destroy: () => ap.destroy(),
            };

            document.querySelectorAll('[data-action]').forEach((el) => {
                el.addEventListener('click', () => actions[el.dataset.action]());
            });
        </script>
    </body>
</html>
